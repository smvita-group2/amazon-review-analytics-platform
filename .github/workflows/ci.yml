name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'feat/**'
      - 'dev-test'

  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-ci:
    name: Python Quality Checks
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Code Formatting Check (Black)
        run: black --check .

      - name: Import Sorting Check (isort)
        run: isort --check-only .

      - name: Linting (Flake8)
        run: flake8 .

      - name: Show Python and PySpark versions
        run: |
          python --version
          python -c "import sys; print(sys.version)"
          python -c "import pyspark; print('PySpark:', pyspark.__version__)"
          python -c "import pyspark.cloudpickle; print('PySpark cloudpickle:', pyspark.cloudpickle.__file__)"
          python -c "import pyspark.cloudpickle.cloudpickle; print('PySpark bundled cloudpickle:', getattr(pyspark.cloudpickle.cloudpickle, '__version__', 'unknown'))"
          pip show pyspark
          pip freeze | grep -Ei 'pyspark|cloudpickle|py4j' || true

      - name: Unit Tests & Coverage (Pytest)
        run: pytest --cov=src --cov-report=term-missing

      - name: Security Scan (Bandit)
        run: bandit -r src

      - name: Static Type Checking (MyPy)
        run: mypy --explicit-package-bases src

  terraform-ci:
    name: Terraform Quality Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (Validation Mode)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate