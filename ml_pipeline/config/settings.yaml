project:
  name: "Amazon Review Analytics"

aws:
  region: "us-east-1"
  bucket_name: "amazon-review-analytics-group-2"

# ==========================================================
# Local Data Paths
# ==========================================================

paths:
  cleaned: "C:/Users/affaa/OneDrive/Desktop/Amazon_RAG_Data/cleaned_data"
  product_documents: "C:/Users/affaa/OneDrive/Desktop/Amazon_RAG_Data/product_documents"
  embeddings: "C:/Users/affaa/OneDrive/Desktop/Amazon_RAG_Data/embeddings"
  bm25: "C:/Users/affaa/OneDrive/Desktop/Amazon_RAG_Data/bm25"
  chromadb_backup: "C:/Users/affaa/OneDrive/Desktop/Amazon_RAG_Data/chromadb"

# ==========================================================
# Embedding Configuration
# ==========================================================

embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  dimension: 384
  batch_size: 32
  normalize_embeddings: true
  show_progress_bar: true

# ==========================================================
# Review Selection
# ==========================================================

review_selection:
  helpful_reviews: 5
  recent_reviews: 3
  
# ==========================================================
# ChromaDB
# ==========================================================

chromadb:
  persist_directory: "C:/Users/affaa/OneDrive/Desktop/Amazon_RAG_Data/chromadb"

# ==========================================================
# Retrieval
# ==========================================================

retrieval:
  top_k_semantic: 10
  top_k_bm25: 10
  final_top_k: 5
  normalize_query_embeddings: true

# ==========================================================
# BM25
# ==========================================================

bm25:
  lowercase: true

# ==========================================================
# Reranker
# ==========================================================

reranker:
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  batch_size: 32
  max_length: 512
  show_progress_bar: false

# ==========================================================
# Gemini
# ==========================================================

gemini:
  model_name: "gemini-2.5-flash"
  temperature: 0.2